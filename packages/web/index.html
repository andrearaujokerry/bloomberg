<!doctype html>
<!--
  WP-01 scaffold — CLIENT.md §1 L39, §2 L172-190.
  The document shell only: one #root, the theme/density attributes the token sheet keys off, and the
  module entry point. Everything visible is rendered by `src/main.tsx` → `src/App.tsx`.
-->
<html lang="en" data-theme="dark" data-density="normal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Dark is the terminal default; `[data-theme="light"]` (TERM-13) flips the tokens. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Terminal — market data workstation" />
    <meta name="referrer" content="same-origin" />
    <title>TERMINAL</title>
    <!-- The mark from `brand/terminal-mark.svg`, inline, so the browser's automatic `/favicon.ico`
         request — a 404 from the plant, which serves only what the build contains — never happens. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cpath d='M18 21 30 32 18 43' fill='none' stroke='%23ffb000' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M35 43h11' fill='none' stroke='%23ffb000' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!--
      The mono face the UI names first (CLIENT.md §12.3) is IBM Plex Mono, but its files have never
      been added to this repository, so there is nothing to preload: the stack in
      `theme/tokens.css` falls through to SF Mono / Menlo / Consolas. A `<link rel="preload">` for
      `/fonts/IBMPlexMono-Regular.woff2` used to stand here and missed on every load — invisibly
      under Vite, and as a 404 once the plant served the build (`http/webApp.ts`). Add it back
      with the files, in `public/fonts/`.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>The terminal requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
